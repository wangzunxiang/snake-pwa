plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ntsec.snake'
    compileSdk 34

    defaultConfig {
        applicationId "com.ntsec.snake"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file('/home/kylin/keystore/snake-release.keystore')
            storePassword "Snake@2026#Release"
            keyAlias "snake"
            keyPassword "Snake@2026#Release"
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 零第三方依赖：纯原生 Activity + WebView
