plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ntsec.snake'
    compileSdk 34

    defaultConfig {
        applicationId "com.ntsec.snake"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    // 签名口令从本地 signing.properties 读取（该文件不入库；
    // 文件缺失时跳过 release 签名配置，仅可构建 debug）
    def propsFile = rootProject.file('signing.properties')
    if (propsFile.exists()) {
        def props = new Properties()
        propsFile.withInputStream { props.load(it) }
        signingConfigs {
            release {
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (project.android.signingConfigs.findByName('release') != null) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 零第三方依赖：纯原生 Activity + WebView
