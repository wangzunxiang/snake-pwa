<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; manifest-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="贪吃蛇 · 本地离线 PWA：零网络请求、零数据采集、无第三方依赖">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>贪吃蛇</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>贪吃蛇</h1>
  <div class="hud">
    <div>分数 <span id="score">0</span></div>
    <div>最高 <span id="best">0</span></div>
  </div>
  <div class="ctrl">
    <button id="btn-pause" aria-label="暂停/继续">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
        <rect x="6" y="5" width="4" height="14" rx="1"/>
        <rect x="14" y="5" width="4" height="14" rx="1"/>
      </svg>
    </button>
    <button id="btn-sound" aria-label="声音开关">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor" stroke="none"/>
        <path d="M16 8a5 5 0 0 1 0 8"/>
        <path d="M18.5 5.5a9 9 0 0 1 0 13"/>
      </svg>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none">
        <path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor" stroke="none"/>
        <line x1="16" y1="9" x2="22" y2="15"/>
        <line x1="22" y1="9" x2="16" y2="15"/>
      </svg>
    </button>
  </div>
</header>
<main>
  <div class="stage">
    <canvas id="game"></canvas>
    <div id="overlay">
      <p id="overlay-text"></p>
      <button id="btn-overlay">开始游戏</button>
    </div>
  </div>
  <div class="dpad" aria-label="方向控制">
    <button class="db up" data-dir="up" aria-label="上">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M12 4l8 9h-5v7h-6v-7H4z"/></svg>
    </button>
    <button class="db left" data-dir="left" aria-label="左">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M15 5l-8 7 8 7z"/></svg>
    </button>
    <button class="db down" data-dir="down" aria-label="下">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M5 9l7 8 7-8z"/></svg>
    </button>
    <button class="db right" data-dir="right" aria-label="右">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M9 5l8 7-8 7z"/></svg>
    </button>
  </div>
</main>
<script src="game.js"></script>
</body>
</html>
